<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>방문 요일에 따라 변하는 배경</title>
</head>
<body>
    <script>
        let today = new Date();
        let day = today.getDay(); // 0=일요일, 1=월요일 ... 6=토요일
        let date = today.getDate(); // 날짜

        let week = ["일", "월", "화", "수", "목", "금", "토"];

        // 배경색 변경
        if (day == 0) {
            document.body.style.backgroundColor = "pink";
        } else {
            document.body.style.backgroundColor = "gold";
        }

        // 화면 출력
        document.write("<h1>일요일은 pink, 다른 요일은 gold 배경</h1>");
        document.write("<hr>");
        document.write("오늘 : " + date + "일, " + week[day] + "요일");
    </script>
</body>
</html>
